name: Build, Email, and Deploy

on:
  schedule:
    # Runs every day at 08:00 UTC. Change the cron if you like.
    - cron: "0 8 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger it manually from GitHub's UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site
        run: python build.py

      - name: Send email for newly revealed poems
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: python send_email.py

      - name: Commit sent-log changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sent_log.json
          git diff --cached --quiet || git commit -m "Update sent log [skip ci]"
          git push
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
